<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0d1117" />
<title>Artifact Gallery</title>

<!-- Icons / PWA -->
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="Gallery" />
<script>try{if(localStorage.getItem('arti.theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
<style>
  :root {
    --bg: #0d1117;
    --bg-elev: #161b22;
    --bg-elev2: #1c2129;
    --border: #2a313c;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #6e9eff;
    --accent-hover: #84b0ff;
    --on-accent: #0b1020;
    --danger: #f87171;
    --danger-bg: #2a1818;
    --danger-border: #5c2b2b;
    --danger-bg-hover: #3a1f1f;
    --green: #3fb950;
    --glass: rgba(13,17,23,.85);
    --chip: rgba(20,25,33,.9);
    --btn-hover: #232a33;
    --btn-hover-border: #3a424e;
    --thumb-bg: #0a0d12;
    --lock-bg: radial-gradient(1200px 600px at 50% -10%, #16203a 0%, var(--bg) 55%);
    --radius: 12px;
    --shadow: 0 8px 30px rgba(0,0,0,.45);
  }
  :root[data-theme="light"] {
    --bg: #eef1f6;
    --bg-elev: #ffffff;
    --bg-elev2: #e7ebf1;
    --border: #d3d9e2;
    --text: #1b2330;
    --text-dim: #5a6675;
    --accent: #3b6ef0;
    --accent-hover: #2f5fe0;
    --on-accent: #ffffff;
    --danger: #cf3636;
    --danger-bg: #fdeaea;
    --danger-border: #f0c2c2;
    --danger-bg-hover: #fbdada;
    --green: #1a8f3c;
    --glass: rgba(255,255,255,.82);
    --chip: rgba(255,255,255,.9);
    --btn-hover: #dce3ec;
    --btn-hover-border: #c3ccd8;
    --thumb-bg: #eef1f6;
    --lock-bg: radial-gradient(1200px 600px at 50% -10%, #dbe6ff 0%, var(--bg) 60%);
    --shadow: 0 6px 24px rgba(70,90,130,.16);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overscroll-behavior: none; touch-action: manipulation; }
  /* No overflow-x:clip/hidden on the root: on iOS Safari that breaks the
     sticky header (WebKit treats it as a scroll container). Instead the
     layout is built so nothing exceeds the viewport width in the first place. */
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo",
      "Noto Sans KR", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  button { font-family: inherit; cursor: pointer; }
  input, textarea { font-family: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border);
    background: var(--bg-elev2);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 500;
    transition: background .15s, border-color .15s, transform .05s;
  }
  .btn:hover { background: var(--btn-hover); border-color: var(--btn-hover-border); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn.danger { color: var(--danger); border-color: var(--danger-border); background: var(--danger-bg); }
  .btn.danger:hover { background: var(--danger-bg-hover); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover { background: var(--bg-elev2); }
  .btn.sm { padding: 6px 10px; font-size: 13px; }

  .hidden { display: none !important; }

  /* ---------- Lock screen ---------- */
  #lock {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--lock-bg);
    z-index: 100;
    padding: 24px 24px calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .lock-card {
    width: 100%; max-width: 380px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: var(--shadow);
    text-align: center;
  }
  .lock-card .logo { font-size: 40px; margin-bottom: 8px; }
  .lock-card h1 { font-size: 21px; margin: 0 0 6px; }
  .lock-card p { color: var(--text-dim); font-size: 13.5px; margin: 0 0 22px; }
  .field { text-align: left; margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--text-dim); margin-bottom: 6px; }
  .field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 11px 12px;
    border-radius: 9px;
    font-size: 15px;
    outline: none;
  }
  .field input:focus { border-color: var(--accent); }
  .lock-msg { font-size: 13px; min-height: 18px; margin: -2px 0 12px; }
  .lock-msg.error { color: var(--danger); }
  .lock-msg.ok { color: var(--green); }
  .lock-actions { display: flex; flex-direction: column; gap: 10px; }
  .lock-footer { margin-top: 18px; font-size: 12px; color: var(--text-dim); }
  .lock-footer a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .lock-footer a:hover { text-decoration: underline; }

  /* ---------- App ---------- */
  #app { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
  header.top {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 14px;
    padding: 12px 20px;
    padding-left: calc(20px + env(safe-area-inset-left, 0px));
    padding-right: calc(20px + env(safe-area-inset-right, 0px));
    background: var(--glass);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 16px; }
  .brand .dot { font-size: 20px; }
  .search {
    flex: 1; max-width: 420px;
    display: flex; align-items: center; gap: 8px;
    background: var(--bg-elev2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 7px 12px;
  }
  .search input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-size: 14px; }
  .search .ic { color: var(--text-dim); }
  .spacer { flex: 1; }
  .count-pill { font-size: 12.5px; color: var(--text-dim); padding: 2px 0; }

  .select {
    background: var(--bg-elev2); color: var(--text);
    border: 1px solid var(--border); border-radius: 9px;
    padding: 8px 10px; font-size: 13.5px; outline: none;
  }
  .select:focus { border-color: var(--accent); }

  .filter-bar, .bulk-bar, .folder-bar {
    max-width: 1280px; margin: 0 auto; width: 100%;
    padding: 10px 20px 0;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .folder-bar { padding-top: 14px; }
  .crumb { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--text-dim); }
  .crumb a { color: var(--text-dim); cursor: pointer; }
  .crumb a:hover { color: var(--text); text-decoration: underline; }
  .crumb .cur { color: var(--text); font-weight: 600; }
  .folder-sep { color: var(--text-dim); opacity: .6; }
  .bulk-bar {
    position: sticky; top: 57px; z-index: 15;
    background: var(--glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border); padding: 10px 20px;
  }
  .bulk-check { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; }
  .tag-chip {
    font-size: 12.5px; padding: 5px 11px; border-radius: 20px;
    background: var(--bg-elev2); border: 1px solid var(--border); color: var(--text-dim);
  }
  .tag-chip:hover { border-color: #3a424e; color: var(--text); }
  .tag-chip.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }

  main { flex: 1; padding: 22px 20px calc(60px + env(safe-area-inset-bottom, 0px)); max-width: 1280px; margin: 0 auto; width: 100%; }

  .card.selectable .thumb { cursor: default; }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .sel-box {
    position: absolute; top: 8px; right: 8px; z-index: 3;
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    background: var(--chip); border: 1px solid var(--border); border-radius: 6px;
  }
  .sel-box input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .card-tags .t {
    font-size: 10.5px; padding: 2px 7px; border-radius: 12px;
    background: var(--bg-elev2); border: 1px solid var(--border); color: var(--text-dim);
  }

  .empty {
    text-align: center; color: var(--text-dim);
    padding: 80px 20px;
  }
  .empty .big { font-size: 46px; margin-bottom: 12px; opacity: .8; }
  .empty h2 { color: var(--text); font-weight: 600; margin: 0 0 8px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px;
  }
  /* compact: smaller cards, more per row, title-only */
  .grid.compact { grid-template-columns: repeat(auto-fill, minmax(min(100%, 158px), 1fr)); gap: 12px; }
  .grid.compact .thumb { height: 104px; }
  .grid.compact .card-meta, .grid.compact .card-tags, .grid.compact .card-actions { display: none; }
  .grid.compact .card-body { padding: 8px 10px; }
  .grid.compact .card-title { font-size: 12.5px; }
  .grid.compact .type-badge { display: none; }
  /* list: one scannable row per item, no thumbnail render */
  .grid.list { display: flex; flex-direction: column; gap: 8px; }
  .list-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 10px;
  }
  .list-row.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .list-row .li-ic { font-size: 17px; width: 22px; text-align: center; flex: none; }
  .list-row .li-main { flex: 1; min-width: 0; cursor: pointer; }
  .list-row .li-title { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-row .li-meta { font-size: 11.5px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-row .li-actions { display: flex; gap: 4px; flex: none; }
  .list-row .li-actions .btn { padding: 6px 9px; }
  .list-row .pin-btn { position: static; width: 30px; height: 30px; flex: none; }
  .card, .list-row {
    -webkit-user-select: none; user-select: none;   /* no text selection/magnifier on long-press drag */
    -webkit-touch-callout: none;
  }
  .card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex; flex-direction: column;
    transition: border-color .15s, transform .1s;
  }
  .card:hover { border-color: #3a4658; transform: translateY(-2px); }
  .thumb {
    position: relative;
    height: 165px;
    background: var(--thumb-bg);
    overflow: hidden;
    /* iOS Safari ignores overflow:hidden for <iframe> and expands it to its
       content width (often 980px for viewport-less artifacts), which leaks out
       and causes horizontal page scroll until a reflow. Layout+paint
       containment forces the iframe to stay inside the thumbnail box. */
    contain: layout paint;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }
  .thumb .frame-wrap {
    position: absolute; top: 0; left: 0;
    width: 200%; height: 200%;
    transform: scale(.5);
    transform-origin: top left;
    pointer-events: none;
  }
  .thumb iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  .thumb .link-thumb {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; color: var(--text-dim); padding: 16px; text-align: center;
  }
  .thumb .link-thumb .ic { font-size: 34px; }
  .thumb .link-thumb .url { font-size: 12px; word-break: break-all; color: var(--accent); }
  .thumb .overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(8,11,16,.0);
    transition: background .15s;
  }
  .thumb:hover .overlay { background: rgba(8,11,16,.45); }
  .thumb .overlay span {
    opacity: 0; transition: opacity .15s;
    background: var(--chip); border: 1px solid var(--border);
    padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
  }
  .thumb:hover .overlay span { opacity: 1; }
  .type-badge {
    position: absolute; top: 8px; left: 8px;
    font-size: 11px; font-weight: 600;
    padding: 3px 8px; border-radius: 20px;
    background: var(--chip); border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .pin-btn {
    position: absolute; top: 6px; right: 6px; z-index: 3;
    width: 28px; height: 28px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    background: var(--chip); border: 1px solid var(--border);
    color: var(--text-dim); font-size: 15px; line-height: 1; cursor: pointer;
  }
  .pin-btn.on { color: #f5b301; border-color: var(--border); background: var(--chip); }
  .pin-btn:hover { color: #ffce54; }
  .card-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
  .card-title { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-meta { font-size: 12px; color: var(--text-dim); }
  .card-actions { display: flex; gap: 6px; padding: 0 14px 12px; }
  .card-actions .btn { flex: 1; justify-content: center; }

  /* ---------- Modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(2,4,8,.7);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 100%; max-width: 600px;
    max-height: 90vh; overflow: auto;
    box-shadow: var(--shadow);
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--bg-elev); z-index: 1;
  }
  .modal-head h2 { font-size: 17px; margin: 0; }
  .modal-body { padding: 20px; }
  .modal-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 0 20px 20px; }

  .tabs { display: flex; gap: 6px; margin-bottom: 18px; background: var(--bg); padding: 4px; border-radius: 10px; }
  .tab { flex: 1; text-align: center; padding: 8px; border-radius: 7px; font-size: 13.5px; color: var(--text-dim); border: none; background: transparent; }
  .tab.active { background: var(--bg-elev2); color: var(--text); font-weight: 600; }

  textarea.code {
    width: 100%; min-height: 200px;
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 9px; padding: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px; resize: vertical; outline: none;
  }
  textarea.code:focus, .modal-body input[type=text]:focus { border-color: var(--accent); }
  .modal-body input[type=text] {
    width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 11px 12px; border-radius: 9px; font-size: 14px; outline: none;
  }
  .modal-body label.lbl { display: block; font-size: 12.5px; color: var(--text-dim); margin: 14px 0 6px; }
  .modal-body label.lbl:first-child { margin-top: 0; }

  .dropzone {
    border: 2px dashed var(--border); border-radius: 12px;
    padding: 36px 20px; text-align: center; color: var(--text-dim);
    transition: border-color .15s, background .15s; cursor: pointer;
  }
  .dropzone.drag { border-color: var(--accent); background: rgba(110,158,255,.08); }
  .dropzone .ic { font-size: 36px; display: block; margin-bottom: 8px; }
  .dropzone .fname { color: var(--green); margin-top: 8px; font-size: 13px; }

  /* ---------- Viewer ---------- */
  #viewer {
    position: fixed; inset: 0; z-index: 80;
    background: var(--bg);
    display: flex; flex-direction: column;
  }
  .viewer-bar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    padding-left: calc(16px + env(safe-area-inset-left, 0px));
    padding-right: calc(16px + env(safe-area-inset-right, 0px));
    background: var(--bg-elev);
  }
  .viewer-bar .vtitle { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #viewer iframe { flex: 1; width: 100%; border: 0; background: #fff; }
  #viewerSourceWrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #viewerSourceWrap #viewerCopy { margin: 10px 16px 0; align-self: flex-start; }
  #viewerCode {
    flex: 1; margin: 10px 0 0; padding: 14px 16px; overflow: auto;
    background: var(--bg); color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--bg-elev2); border: 1px solid var(--border);
    color: var(--text); padding: 11px 18px; border-radius: 10px;
    font-size: 13.5px; z-index: 200; box-shadow: var(--shadow);
    opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  .hint { font-size: 12px; color: var(--text-dim); margin-top: 6px; line-height: 1.5; }

  /* ---------- Arrange (drag) mode ---------- */
  @keyframes jiggle { 0% { transform: rotate(-1.1deg); } 50% { transform: rotate(1.1deg); } 100% { transform: rotate(-1.1deg); } }
  #app.arrange .card, #app.arrange .list-row { animation: jiggle .28s ease-in-out infinite; touch-action: none; }
  #app.arrange .card:hover { transform: none; }
  #app.arrange main { padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
  .drag-ghost {
    position: fixed; z-index: 300; pointer-events: none; opacity: .93;
    box-shadow: var(--shadow); border-radius: var(--radius); overflow: hidden;
    animation: none !important;
  }
  .drag-source { opacity: .35; }
  .drop-merge { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius); }
  .tag-chip.drop-into { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .arrange-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 16px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    padding-left: calc(16px + env(safe-area-inset-left, 0px));
    padding-right: calc(16px + env(safe-area-inset-right, 0px));
    background: var(--accent); color: var(--on-accent);
    font-size: 13.5px; font-weight: 600; box-shadow: 0 -4px 20px rgba(0,0,0,.28);
  }
  .arrange-bar .btn { background: var(--on-accent); color: var(--accent); border: none; font-weight: 700; }

  /* ---------- Responsive (mobile / narrow) ---------- */
  /* Breakpoint at 760px: the single-row desktop header needs ~700px, so below
     that we switch to a deterministic two-row CSS grid. Grid (rather than
     flex-wrap + order tricks) guarantees the header never overflows: the
     minmax(0,1fr) search column is allowed to shrink below its content width,
     which flexbox min-width handling does inconsistently across engines
     (notably iOS Safari). */
  @media (max-width: 760px) {
    /* iOS Safari auto-zooms when a focused form control has font-size < 16px,
       which enlarges the page past the viewport and produces phantom
       horizontal + vertical scrollbars (the lock screen auto-focuses the
       password field on load, so it happened immediately). Keep all controls
       at >=16px on touch-sized screens to prevent the zoom. */
    input, select, textarea, .field input, .search input,
    .modal-body input[type=text], textarea.code, .select {
      font-size: 16px;
    }
    header.top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto auto;
      grid-template-areas:
        "brand  brand add  menu"
        "search view  sort select";
      gap: 8px 8px;
      padding: 10px 12px;
      padding-left: calc(12px + env(safe-area-inset-left, 0px));
      padding-right: calc(12px + env(safe-area-inset-right, 0px));
      align-items: center;
    }
    .brand { grid-area: brand; min-width: 0; font-size: 15px; }
    .brand span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #addBtn { grid-area: add; }
    #menuBtn { grid-area: menu; }

<div class="toast" id="toast"></div>

<script>
"use strict";

// iOS Safari ignores user-scalable=no / maximum-scale, so block zoom in JS:
// pinch zoom fires iOS-only gesture* events; double-tap zoom is handled by
// the CSS touch-action: manipulation.
(function lockZoom() {
  const stop = (e) => e.preventDefault();
  document.addEventListener("gesturestart", stop, { passive: false });
  document.addEventListener("gesturechange", stop, { passive: false });
  document.addEventListener("gestureend", stop, { passive: false });
  document.addEventListener("touchmove", (e) => {
    if (e.touches && e.touches.length > 1) e.preventDefault();   // two-finger pinch
  }, { passive: false });
})();

// ===================== Storage + crypto =====================
const STORAGE_KEY = "arti.vault.v1";          // legacy localStorage key (auto-migrated)
const IDB_NAME = "arti", IDB_STORE = "kv", VAULT_ID = "vault";
const enc = new TextEncoder();
const dec = new TextDecoder();

// chunked base64 so huge buffers don't blow the call stack (used for backups)
const b64 = (bytes) => {
  const u = new Uint8Array(bytes); let s = "";
  for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(s);
};
const ub64 = (str) => Uint8Array.from(atob(str), c => c.charCodeAt(0));

// ---- IndexedDB key/value store (large quota, unlike localStorage's ~5MB) ----
let _dbPromise = null;
function idb() {
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((res, rej) => {
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(IDB_STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return _dbPromise;
}
async function idbGet(key) {
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction(IDB_STORE, "readonly").objectStore(IDB_STORE).get(key);
    t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error);
  });
}
async function idbSet(key, val) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error || new DOMException("aborted", "AbortError"));
  });
}
async function idbDel(key) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}

// ---- gzip compression (CompressionStream: Safari 16.4+, Chrome 80+); no-op fallback ----
async function gzip(bytes) {
  if (typeof CompressionStream === "undefined") return { data: bytes, comp: false };
  const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"));
  return { data: new Uint8Array(await new Response(stream).arrayBuffer()), comp: true };
}
async function gunzip(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function deriveKey(password, salt) {
  const baseKey = await crypto.subtle.importKey(
    "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
  );
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: 250000, hash: "SHA-256" },
    baseKey,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}

function storageErr(e) {
  const name = (e && e.name) || "";
  if (name === "QuotaExceededError" || /quota|exceeded/i.test((e && e.message) || ""))
    return "저장 공간이 부족합니다. 백업 후 일부 아티팩트를 삭제해 주세요.";
  return "저장에 실패했습니다: " + ((e && e.message) || e);
}

// ===================== State =====================
let cryptoKey = null;        // in-memory AES key (cleared on lock)
let saltB64 = null;          // current salt
let store = { artifacts: [] };

// view state
let sortMode = "new";
let tagFilter = null;        // active tag, or null
let currentCollection = "ALL";   // "ALL" | null (미분류) | collection id
let viewMode = localStorage.getItem("arti.view") || "card";   // card | compact | list
let selectMode = false;
let selected = new Set();

// Internal vault shape: { v, salt:b64, iv:b64, comp:bool, ct:ArrayBuffer }
async function readVault() {
  const v = await idbGet(VAULT_ID);
  if (v) return v;
  // migrate legacy localStorage vault (v1: all-b64 strings, uncompressed)
  try {
    const old = localStorage.getItem(STORAGE_KEY);
    if (old) {
      const o = JSON.parse(old);
      if (o && o.salt && o.iv && o.ct)
        return { v: 1, salt: o.salt, iv: o.iv, comp: false, ct: ub64(o.ct).buffer };
    }
  } catch {}
  return null;
}
async function writeVault(v) { await idbSet(VAULT_ID, v); }

async function persist() {
  const plain = enc.encode(JSON.stringify(store));
  const { data, comp } = await gzip(plain);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, cryptoKey, data);
  await writeVault({ v: 2, salt: saltB64, iv: b64(iv), comp, ct });
}

async function decryptVault(key, vault) {
  const ctBuf = vault.ct instanceof ArrayBuffer ? vault.ct : ub64(vault.ct).buffer;
  const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub64(vault.iv) }, key, ctBuf);
  let bytes = new Uint8Array(buf);
  if (vault.comp) bytes = await gunzip(bytes);
  return JSON.parse(dec.decode(bytes));
}

// ===================== Lock screen logic =====================
const $ = (id) => document.getElementById(id);
const lockEl = $("lock"), appEl = $("app");
let isSetup = false;

async function initLockScreen() {
  const vault = await readVault();
  isSetup = !vault;
  if (isSetup) {
    $("lockTitle").textContent = "비밀번호 설정";
    $("lockSub").textContent = "갤러리를 보호할 마스터 비밀번호를 만드세요.";
    $("lockBtn").textContent = "비밀번호 생성";
    $("pw2Field").classList.remove("hidden");
    $("setupHint").classList.remove("hidden");
    $("restoreLink").classList.remove("hidden");
  } else {
    $("lockTitle").textContent = "갤러리 잠금 해제";
    $("lockSub").textContent = "비밀번호를 입력해 아티팩트를 복호화하세요.";
    $("lockBtn").textContent = "잠금 해제";
    $("pw2Field").classList.add("hidden");
    $("setupHint").classList.add("hidden");
  }
  setTimeout(() => $("pw").focus(), 50);
}

function lockMsg(text, kind) {
  const el = $("lockMsg");
  el.textContent = text || "";
  el.className = "lock-msg" + (kind ? " " + kind : "");
}

$("lockForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = $("pw").value;
  if (!pw) { lockMsg("비밀번호를 입력하세요.", "error"); return; }
  $("lockBtn").disabled = true;

  try {
    if (isSetup) {
      if (pw.length < 4) { lockMsg("4자 이상으로 설정하세요.", "error"); return; }
      if (pw !== $("pw2").value) { lockMsg("비밀번호가 일치하지 않습니다.", "error"); return; }
      const salt = crypto.getRandomValues(new Uint8Array(16));
      saltB64 = b64(salt);
      cryptoKey = await deriveKey(pw, salt);
      store = { artifacts: [], collections: [] };
      await persist();
      enterApp();
    } else {
      const vault = await readVault();
      saltB64 = vault.salt;
      const key = await deriveKey(pw, ub64(vault.salt));
      let data;
      try {
        data = await decryptVault(key, vault);
      } catch {
        lockMsg("비밀번호가 올바르지 않습니다.", "error");
        return;
      }
      cryptoKey = key;
      store = data && data.artifacts ? data : { artifacts: [] };
      if (!Array.isArray(store.collections)) store.collections = [];
      currentCollection = "ALL";
      // upgrade a legacy (localStorage / uncompressed) vault to IndexedDB + gzip
      if (vault.v !== 2) {
        try { await persist(); localStorage.removeItem(STORAGE_KEY); } catch {}
      }
      enterApp();
    }
  } finally {
    $("lockBtn").disabled = false;
    $("pw").value = ""; $("pw2").value = "";
  }
});

function enterApp() {
  lockMsg("");
  lockEl.classList.add("hidden");
  appEl.classList.remove("hidden");
  renderGrid();
  resetAutolock();
}

function lockApp() {
  stopAutolock();
  cryptoKey = null; store = { artifacts: [], collections: [] };
  selectMode = false; selected.clear(); tagFilter = null; currentCollection = "ALL";
  $("bulkBar").classList.add("hidden");
  appEl.classList.add("hidden");
  $("viewer").classList.add("hidden");
  clearViewerContent();
  lockEl.classList.remove("hidden");
  initLockScreen();
}

// ===================== Auto-lock =====================
let autolockMs = Number(localStorage.getItem("arti.autolock") || 0);   // 0 = off
let autolockTimer = null, hiddenAt = 0;
function resetAutolock() {
  if (autolockTimer) { clearTimeout(autolockTimer); autolockTimer = null; }
  if (autolockMs > 0 && cryptoKey) autolockTimer = setTimeout(lockApp, autolockMs);
}
function stopAutolock() { if (autolockTimer) { clearTimeout(autolockTimer); autolockTimer = null; } }
["pointerdown", "keydown", "touchstart", "scroll"].forEach(ev =>
  document.addEventListener(ev, () => { if (cryptoKey) resetAutolock(); }, { passive: true }));
document.addEventListener("visibilitychange", () => {
  if (!cryptoKey || autolockMs <= 0) return;
  if (document.hidden) hiddenAt = Date.now();
  else if (hiddenAt && Date.now() - hiddenAt >= autolockMs) lockApp();
  else resetAutolock();
});

// ===================== Theme =====================
function setTheme(theme) {
  if (theme === "light") document.documentElement.setAttribute("data-theme", "light");
  else document.documentElement.removeAttribute("data-theme");
  localStorage.setItem("arti.theme", theme);
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute("content", theme === "light" ? "#f6f8fa" : "#0d1117");
}

// ===================== Artifacts CRUD =====================
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

async function addArtifact(a) {
  store.artifacts.unshift({ id: uid(), createdAt: Date.now(), ...a });
  try { await persist(); }
  catch (e) { store.artifacts.shift(); renderGrid(); throw e; }   // roll back on quota/error
  renderGrid();
}
async function deleteArtifact(id) {
  store.artifacts = store.artifacts.filter(a => a.id !== id);
  await persist();
  renderGrid();
}
const MAX_VERSIONS = 30;
async function updateArtifact(id, patch) {
  const a = store.artifacts.find(x => x.id === id);
  if (!a) return;
  const before = { title: a.title, tags: a.tags, content: a.content, updatedAt: a.updatedAt,
                   versionsLen: a.versions ? a.versions.length : 0 };
  // snapshot the previous content into history when the content actually changes (HTML only)
  const didSnapshot = patch.content !== undefined && patch.content !== a.content && a.type !== "link";
  if (didSnapshot) {
    if (!a.versions) a.versions = [];
    a.versions.push({ content: a.content, savedAt: a.updatedAt || a.createdAt });
    if (a.versions.length > MAX_VERSIONS) a.versions.splice(0, a.versions.length - MAX_VERSIONS);
  }
  Object.assign(a, patch, { updatedAt: Date.now() });
  searchCache.delete(a);
  try { await persist(); }
  catch (e) {
    a.title = before.title; a.tags = before.tags; a.content = before.content; a.updatedAt = before.updatedAt;
    if (didSnapshot && a.versions) a.versions.length = before.versionsLen;
    searchCache.delete(a); renderGrid(); throw e;                // roll back on quota/error
  }
  renderGrid();
}
async function forkArtifact(a) {
  await addArtifact({
    type: a.type,
    title: (a.title || "제목 없음") + " (사본)",
    content: a.content,
    tags: [...(a.tags || [])],
    collectionId: a.collectionId || null
  });
}
async function restoreVersion(id, content) {
  await updateArtifact(id, { content });   // auto-snapshots the current content first
}
function parseTags(str) {
  return [...new Set((str || "").split(",").map(s => s.trim()).filter(Boolean))];
}

// ===================== Collections (folders) =====================
function collections() { return store.collections || (store.collections = []); }
function collectionById(id) { return collections().find(c => c.id === id) || null; }
function childCollections(parentId) {
  return collections().filter(c => (c.parentId || null) === (parentId || null))
    .sort((a, b) => a.name.localeCompare(b.name, "ko"));
}
function collectionPath(id) {   // [root..this]
  const path = []; let c = collectionById(id);
  while (c) { path.unshift(c); c = c.parentId ? collectionById(c.parentId) : null; }
  return path;
}
function descendantIds(id) {
  const out = []; const walk = (pid) => childCollections(pid).forEach(c => { out.push(c.id); walk(c.id); });
  walk(id); return out;
}
function countIn(scope) {   // direct count for a collection scope
  return store.artifacts.filter(a =>
    scope === "ALL" ? true : scope === null ? !a.collectionId : a.collectionId === scope).length;
}
async function createCollection(name, parentId) {
  name = (name || "").trim(); if (!name) return null;
  const c = { id: uid(), name, parentId: parentId || null, createdAt: Date.now() };
  collections().push(c);
  try { await persist(); } catch (e) { collections().pop(); toast(storageErr(e)); return null; }
  return c;
}
async function renameCollection(id, name) {
  const c = collectionById(id); if (!c) return;
  name = (name || "").trim(); if (!name) return;
  const old = c.name; c.name = name;
  try { await persist(); } catch (e) { c.name = old; toast(storageErr(e)); }
}
async function deleteCollection(id) {
  const c = collectionById(id); if (!c) return;
  const parent = c.parentId || null;
  // reparent direct child folders + move artifacts up to this folder's parent
  collections().forEach(x => { if ((x.parentId || null) === id) x.parentId = parent; });
  store.artifacts.forEach(a => { if (a.collectionId === id) a.collectionId = parent; });
  store.collections = collections().filter(x => x.id !== id);
  try { await persist(); } catch (e) { toast(storageErr(e)); }
  if (currentCollection === id) currentCollection = parent || "ALL";
}
async function moveArtifacts(ids, collectionId) {
  store.artifacts.forEach(a => { if (ids.includes(a.id)) a.collectionId = collectionId; });
  try { await persist(); } catch (e) { toast(storageErr(e)); }
}
function setCollection(scope) { currentCollection = scope; renderGrid(); }

// flat list of {id, label} for folder pickers, indented by depth
function collectionOptions() {
  const out = []; const walk = (pid, depth) => childCollections(pid).forEach(c => {
    out.push({ id: c.id, label: " ".repeat(depth * 3) + "📁 " + c.name }); walk(c.id, depth + 1);
  });
  walk(null, 0); return out;
}
function fillFolderSelect(sel, selectedId) {
  sel.innerHTML = ['<option value="__none__">📁 미분류 (폴더 없음)</option>']
    .concat(collectionOptions().map(o => `<option value="${o.id}">${esc(o.label)}</option>`)).join("");
  sel.value = selectedId || "__none__";
}

function renderFolderBar() {
  const bar = $("folderBar");
  const cols = collections();
  if (cols.length === 0 && currentCollection === "ALL") { bar.classList.add("hidden"); bar.innerHTML = ""; return; }
  bar.classList.remove("hidden");

  const chip = (label, scope, active, extra) =>
    `<button class="tag-chip ${active ? "active" : ""}" data-scope="${scope}" ${extra || ""}>${label}</button>`;

  let html = "";
  // breadcrumb when inside a folder
  if (currentCollection !== "ALL" && currentCollection !== null) {
    const path = collectionPath(currentCollection);
    html += `<span class="crumb"><a data-scope="ALL">🗂 전체</a>`;
    path.forEach((c, i) => {
      html += `<span class="folder-sep">/</span>` +
        (i === path.length - 1 ? `<span class="cur">${esc(c.name)}</span>` : `<a data-scope="${c.id}">${esc(c.name)}</a>`);
    });
    html += `</span>`;
  } else {
    html += chip("🗂 전체", "ALL", currentCollection === "ALL");
    if (countIn(null) > 0 || currentCollection === null)
      html += chip(`📁 미분류 (${countIn(null)})`, "__none__", currentCollection === null);
  }

  // child folders of current scope
  const parentForChildren = (currentCollection === "ALL" || currentCollection === null) ? null : currentCollection;
  childCollections(parentForChildren).forEach(c => {
    html += chip(`📁 ${esc(c.name)} (${countIn(c.id)})`, c.id, false);
  });

  // actions
  html += `<button class="tag-chip" data-act="newfolder">＋ 폴더</button>`;
  if (currentCollection !== "ALL" && currentCollection !== null)
    html += `<button class="tag-chip" data-act="editfolder">✎ 폴더명/삭제</button>`;

  bar.innerHTML = html;
  bar.querySelectorAll("[data-scope]").forEach(el => {
    el.onclick = () => { const s = el.dataset.scope; setCollection(s === "ALL" ? "ALL" : s === "__none__" ? null : s); };
  });
  const nf = bar.querySelector('[data-act="newfolder"]');
  if (nf) nf.onclick = async () => {
    const name = prompt("새 폴더 이름");
    if (name && name.trim()) {
      const parent = (currentCollection === "ALL" || currentCollection === null) ? null : currentCollection;
      await createCollection(name, parent); renderGrid();
    }
  };

// ===================== Rendering =====================
function fmtDate(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
}
function esc(s) { return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function allTags() {
  const set = new Set();
  store.artifacts.forEach(a => (a.tags || []).forEach(t => set.add(t)));
  return [...set].sort((x, y) => x.localeCompare(y, "ko"));
}

function renderFilterBar() {
  const bar = $("filterBar");
  const tags = allTags();
  if (tags.length === 0) { bar.classList.add("hidden"); bar.innerHTML = ""; return; }
  bar.classList.remove("hidden");
  bar.innerHTML =
    `<button class="tag-chip ${tagFilter === null ? "active" : ""}" data-tag="">전체</button>` +
    tags.map(t => `<button class="tag-chip ${tagFilter === t ? "active" : ""}" data-tag="${esc(t)}">🏷 ${esc(t)}</button>`).join("");
  bar.querySelectorAll(".tag-chip").forEach(c => {
    c.onclick = () => { tagFilter = c.dataset.tag || null; renderFilterBar(); renderGrid(); };
  });
}

// Lowercased searchable text per artifact, memoized off the persisted object
// (WeakMap, so it never bloats the stored vault). Invalidated on edit.
const searchCache = new WeakMap();
function haystack(a) {
  let h = searchCache.get(a);
  if (h === undefined) {
    h = ((a.title || "") + "\n" + (a.tags || []).join(" ") + "\n" + (a.content || "")).toLowerCase();
    searchCache.set(a, h);
  }
  return h;
}

function visibleArtifacts() {
  const q = $("searchInput").value.trim().toLowerCase();
  let items = store.artifacts.filter(a => {
    // folder scope: ALL = everything, null = unfiled, id = that folder (direct)
    if (currentCollection === null) { if (a.collectionId) return false; }
    else if (currentCollection !== "ALL") { if (a.collectionId !== currentCollection) return false; }
    if (q && !haystack(a).includes(q)) return false;   // title + tags + content
    if (tagFilter && !(a.tags || []).includes(tagFilter)) return false;
    return true;
  });
  if (sortMode === "manual") return items;   // keep store.artifacts array order (manual)
  if (sortMode === "new") items.sort((a, b) => b.createdAt - a.createdAt);
  else if (sortMode === "old") items.sort((a, b) => a.createdAt - b.createdAt);
  else if (sortMode === "title") items.sort((a, b) => (a.title || "").localeCompare(b.title || "", "ko"));
  items.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));   // pinned first (stable)
  return items;
}
async function togglePin(id) {
  const a = store.artifacts.find(x => x.id === id);
  if (!a) return;
  try { await updateArtifact(id, { pinned: !a.pinned }); }   // metadata only → no version snapshot
  catch (e) { toast(storageErr(e)); }
}

function renderGrid() {
  renderFolderBar();
  renderFilterBar();
  const items = visibleArtifacts();
  $("countPill").textContent = `${store.artifacts.length}개`;

  const grid = $("grid"), empty = $("emptyState");
  grid.className = "grid" + (viewMode === "compact" ? " compact" : viewMode === "list" ? " list" : "");
  grid.innerHTML = "";
  if (store.artifacts.length === 0) { empty.classList.remove("hidden"); updateBulkBar(); return; }
  empty.classList.add("hidden");

  if (items.length === 0) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="big">🔍</div><h2>결과 없음</h2></div>`;
    updateBulkBar(); return;
  }

  if (viewMode === "list") {
    for (const a of items) {
      const isLink = a.type === "link";

      row.className = "list-row" + (selected.has(a.id) ? " selected" : "");

        ? `<div class="sel-box" style="position:static"><input type="checkbox" data-sel="${a.id}" ${selected.has(a.id) ? "checked" : ""}></div>` : "";
      const pinBtn = selectMode ? ""

      row.innerHTML = `

  for (const a of items) {

    card.dataset.id = a.id;

    }

    const pinBtn = selectMode ? ""
      : `<button class="pin-btn ${a.pinned ? "on" : ""}" data-act="pin" data-id="${a.id}" title="${a.pinned ? "고정 해제" : "상단 고정"}">${a.pinned ? "★" : "☆"}</button>`;

// Grid click delegation
$("grid").addEventListener("click", (e) => {
  if (arrangeMode || justDragged) return;   // ignore taps while arranging / right after a drag
  const selCb = e.target.closest("[data-sel]");
  if (selCb) { toggleSelect(selCb.dataset.sel); return; }

  const actBtn = e.target.closest("[data-act]");
  if (actBtn) {
    const a = store.artifacts.find(x => x.id === actBtn.dataset.id);
    if (!a) return;
    const act = actBtn.dataset.act;
    if (act === "open") { if (selectMode) toggleSelect(a.id); else openArtifact(a); }
    else if (act === "edit") openEditModal(a);
    else if (act === "download") downloadArtifact(a);
    else if (act === "delete") confirmDelete(a);
    else if (act === "pin") togglePin(a.id);
    return;
  }

  const thumb = e.target.closest(".thumb");
  if (thumb) {
    if (selectMode) { toggleSelect(thumb.dataset.id); return; }
    const a = store.artifacts.find(x => x.id === thumb.dataset.id);
    if (a) openArtifact(a);
  }
});

// Render the artifact via a blob: URL rather than srcdoc. A srcdoc document
// has no URL of its own, so in-page "#" anchor links resolve against the
// parent (gallery) URL and reload the app — its lock screen then appears
// inside the artifact. A blob: URL gives the document its own base, so "#"
// links stay within the artifact.
let viewerBlobUrl = null;
let viewerContent = "";
function setViewerContent(html) {
  const f = $("viewerFrame");
  if (viewerBlobUrl) { URL.revokeObjectURL(viewerBlobUrl); viewerBlobUrl = null; }
  const blob = new Blob([html], { type: "text/html" });
  viewerBlobUrl = URL.createObjectURL(blob);
  f.removeAttribute("srcdoc");
  f.src = viewerBlobUrl;
}
function showViewerRendered() {
  $("viewerFrame").classList.remove("hidden");
  $("viewerSourceWrap").classList.add("hidden");
  $("viewerSource").classList.remove("primary");
  $("viewerSource").innerHTML = "&lt;/&gt; 소스";
  setViewerContent(viewerContent);
}
function showViewerSource() {
  if (viewerBlobUrl) { URL.revokeObjectURL(viewerBlobUrl); viewerBlobUrl = null; }
  $("viewerFrame").src = "about:blank";
  $("viewerFrame").classList.add("hidden");
  $("viewerCode").textContent = viewerContent;
  $("viewerSourceWrap").classList.remove("hidden");
  $("viewerSource").classList.add("primary");
  $("viewerSource").textContent = "🖼 미리보기";
}
function clearViewerContent() {
  $("viewerFrame").src = "about:blank";
  if (viewerBlobUrl) { URL.revokeObjectURL(viewerBlobUrl); viewerBlobUrl = null; }
  $("viewerSourceWrap").classList.add("hidden");
  $("viewerFrame").classList.remove("hidden");
  viewerContent = "";
}

function downloadArtifact(a) {
  let blob, name;
  if (a.type === "link") {
    blob = new Blob([a.content], { type: "text/plain" });
    name = (a.title || "link") + ".txt";
  } else {
    blob = new Blob([a.content], { type: "text/html" });
    name = (a.title || "artifact").replace(/[^\w가-힣 .-]/g, "_") + ".html";
  }
  triggerDownload(blob, name);
}
function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function confirmDelete(a) {
  if (confirm(`"${a.title || "(제목 없음)"}" 을(를) 삭제할까요?`)) {
    deleteArtifact(a.id);
    toast("삭제됨");
  }
}

  function loadFile(file) {
    fileName = file.name;
    const reader = new FileReader();
    reader.onload = () => {
      fileContent = reader.result;
      $("mFname").textContent = "✓ " + fileName;
      if (!$("mTitle").value) $("mTitle").value = fileName.replace(/\.html?$/i, "");
    };
    reader.readAsText(file);
  }

  // save
  $("mSave").onclick = async () => {
    const title = $("mTitle").value.trim();
    const tags = parseTags($("mTags").value);
    let art;
    if (tab === "paste") {
      const code = $("mCode").value.trim();
      if (!code) { toast("HTML 코드를 입력하세요"); return; }
      art = { type: "html", title: title || "붙여넣은 아티팩트", content: code, tags };
    } else if (tab === "upload") {
      if (!fileContent) { toast("파일을 선택하세요"); return; }
      art = { type: "html", title: title || fileName.replace(/\.html?$/i, ""), content: fileContent, tags };
    } else {
      let url = $("mUrl").value.trim();
      if (!url) { toast("URL을 입력하세요"); return; }
      if (!/^https?:\/\//i.test(url)) url = "https://" + url;
      art = { type: "link", title: title || url, content: url, tags };
    }
    art.collectionId = $("mFolder").value === "__none__" ? null : $("mFolder").value;
    const dup = store.artifacts.find(x => x.type === art.type && x.content === art.content);
    if (dup && !confirm(`이미 동일한 내용의 아티팩트가 있어요${dup.title ? ` ("${dup.title}")` : ""}. 그래도 추가할까요?`)) return;
    $("mSave").disabled = true;
    try {
      await addArtifact(art);
      closeModal();
      toast("추가됨 ✓");
    } catch (e) {
      $("mSave").disabled = false;
      toast(storageErr(e));
    }
  };

  setTimeout(() => $("mTitle").focus(), 50);
}

// ===================== Version history =====================
function fmtDateTime(ts) {
  const d = new Date(ts);
  return `${fmtDate(ts)} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function versionRow(label, content, isCurrent, idx) {
  return `<div style="display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:9px;padding:8px 10px">
    <div style="flex:1;min-width:0">
      <div style="font-size:13.5px;font-weight:${isCurrent ? 600 : 500}">${isCurrent ? "🟢 현재" : esc(label)}</div>
      <div class="card-meta" style="font-size:11.5px">${(content.length / 1024).toFixed(1)} KB</div>
    </div>
    <button class="btn sm" data-act="preview" data-i="${idx}">미리보기</button>
    ${isCurrent ? "" : `<button class="btn sm" data-act="restore" data-i="${idx}">되돌리기</button>`}
    <button class="btn sm" data-act="fork" data-i="${idx}">복제</button>
  </div>`;
}
function openHistoryModal(a) {
  const versions = a.versions || [];
  const rows = [versionRow("현재", a.content, true, -1)];
  for (let i = versions.length - 1; i >= 0; i--) rows.push(versionRow(fmtDateTime(versions[i].savedAt), versions[i].content, false, i));
  modalEl = document.createElement("div");
  modalEl.className = "modal-backdrop";
  modalEl.innerHTML = `
    <div class="modal" style="max-width:480px">
      <div class="modal-head"><h2>버전 기록 — ${esc(a.title || "")}</h2><button class="btn ghost" id="mClose">✕</button></div>
      <div class="modal-body">
        ${versions.length === 0 ? `<div class="hint" style="margin-bottom:12px">아직 이전 버전이 없어요. 편집해서 내용을 바꾸면 직전 내용이 자동으로 기록됩니다. (최근 ${MAX_VERSIONS}개 보관)</div>` : ""}
        <div id="verList" style="display:flex;flex-direction:column;gap:8px">${rows.join("")}</div>
      </div>
    </div>`;
  document.body.appendChild(modalEl);
  modalEl.addEventListener("click", (e) => { if (e.target === modalEl) closeModal(); });
  $("mClose").onclick = closeModal;
  $("verList").addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-act]"); if (!btn) return;
    const i = Number(btn.dataset.i);
    const content = i < 0 ? a.content : (a.versions && a.versions[i] && a.versions[i].content);
    if (content == null) return;
    const act = btn.dataset.act;
    if (act === "preview") {
      openViewer((a.title || "") + (i < 0 ? "" : " · 이전 버전"), content);
    } else if (act === "restore") {
      if (!confirm("이 버전 내용으로 되돌릴까요? 현재 내용은 버전 기록에 남습니다.")) return;
      try { await restoreVersion(a.id, content); closeModal(); toast("되돌림 ✓"); }
      catch (err) { toast(storageErr(err)); }
    } else if (act === "fork") {
      try { await forkArtifact({ ...a, content }); closeModal(); toast("복제됨 ✓"); }
      catch (err) { toast(storageErr(err)); }
    }
  });
}

// ===================== Arrange (drag) mode =====================
// Drop one item onto another -> create a folder with both (priority 1).
// Drop onto a folder chip -> move into it (priority 2). Drag between items
// -> reorder (priority 3, "내 순서"). Works with touch + mouse via Pointer Events.
let arrangeMode = false;
let justDragged = false;
let press = null;          // pending press / active drag state
const LP_MS = 420, MOVE_CANCEL = 12, DRAG_START = 6;

function setArrange(on) {
  arrangeMode = on;
  appEl.classList.toggle("arrange", on);
  let bar = document.getElementById("arrangeBar");
  if (on) {
    if (sortMode !== "manual") { sortMode = "manual"; const s = $("sortSelect"); if (s) s.value = "manual"; }
    if (selectMode) setSelectMode(false);
    if (!bar) {
      bar = document.createElement("div");
      bar.id = "arrangeBar"; bar.className = "arrange-bar";
      bar.innerHTML = `<span>정렬 편집 — 끌어서 이동 · 겹쳐서 폴더</span><button class="btn sm" id="arrangeDone">완료</button>`;
      document.body.appendChild(bar);
      bar.querySelector("#arrangeDone").onclick = () => setArrange(false);
    }
  } else if (bar) { bar.remove(); }
  renderGrid();
}

function clearDropHints() {
  document.querySelectorAll(".drop-merge").forEach(el => el.classList.remove("drop-merge"));
  document.querySelectorAll(".tag-chip.drop-into").forEach(el => el.classList.remove("drop-into"));
}

$("grid").addEventListener("pointerdown", (e) => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  if (selectMode) return;
  const itemEl = e.target.closest(".card, .list-row");
  if (!itemEl || !itemEl.dataset.id) return;
  if (!arrangeMode && e.target.closest("button, a, input, select, textarea")) return; // let controls work
  press = { id: itemEl.dataset.id, itemEl, x: e.clientX, y: e.clientY, lastX: e.clientX, lastY: e.clientY,
            pointerId: e.pointerId, dragging: false, timer: null, dropTarget: null };
  if (!arrangeMode) press.timer = setTimeout(() => longPressFire(), LP_MS);
});

function longPressFire() {
  if (!press || press.dragging) return;
  if (Math.hypot(press.lastX - press.x, press.lastY - press.y) > MOVE_CANCEL) return;
  if (!arrangeMode) setArrange(true);              // rebuilds grid (jiggle)
  press.itemEl = $("grid").querySelector(`[data-id="${press.id}"]`) || press.itemEl;
  if (press.itemEl) beginDrag();
}

document.addEventListener("pointermove", (e) => {
  if (!press) return;
  press.lastX = e.clientX; press.lastY = e.clientY;
  if (!press.dragging) {
    const moved = Math.hypot(e.clientX - press.x, e.clientY - press.y);
    if (!arrangeMode) { if (moved > MOVE_CANCEL) { clearTimeout(press.timer); press = null; } return; }
    if (moved > DRAG_START) beginDrag(); else return;
  }
  e.preventDefault();
  dragMove(e);
}, { passive: false });

document.addEventListener("pointerup", endPress);
document.addEventListener("pointercancel", endPress);

function beginDrag() {
  press.dragging = true;
  try { window.getSelection().removeAllRanges(); } catch {}   // drop any text selection from the press
  const el = press.itemEl, r = el.getBoundingClientRect();
  press.offX = press.lastX - r.left; press.offY = press.lastY - r.top;
  const g = el.cloneNode(true);
  g.classList.add("drag-ghost");
  g.style.width = r.width + "px"; g.style.left = r.left + "px"; g.style.top = r.top + "px";
  // append inside #grid (not body) so .grid.compact / .grid.list descendant
  // styles still apply to the ghost; position:fixed keeps it out of layout
  $("grid").appendChild(g);
  press.ghost = g;
  el.classList.add("drag-source");
}

function cancelDwell() {
  if (press.dwellTimer) { clearTimeout(press.dwellTimer); press.dwellTimer = null; }
  press.dwellId = null; press.merge = null;
}
function reorderDom(over, e) {
  const ir = over.getBoundingClientRect();
  const before = e.clientY < ir.top + ir.height / 2;
  over.parentNode.insertBefore(press.itemEl, before ? over : over.nextSibling);
}
function dragMove(e) {
  const g = press.ghost;
  g.style.left = (e.clientX - press.offX) + "px";
  g.style.top = (e.clientY - press.offY) + "px";
  const vh = window.innerHeight;                       // auto-scroll near edges
  if (e.clientY < 90) window.scrollBy(0, -14);
  else if (e.clientY > vh - 90) window.scrollBy(0, 14);

  g.style.display = "none";
  const under = document.elementFromPoint(e.clientX, e.clientY);
  g.style.display = "";
  clearDropHints();

  // priority 2: drop onto a folder chip
  const chip = under && under.closest("#folderBar [data-scope]");
  if (chip) {
    const sc = chip.dataset.scope;
    if (sc !== "ALL" && sc !== "__none__") { chip.classList.add("drop-into"); cancelDwell(); press.dropTarget = { type: "folder", id: sc }; return; }
  }

  const over = under && under.closest(".card, .list-row");
  if (!over || !over.dataset.id || over.dataset.id === press.id) { cancelDwell(); press.dropTarget = { type: "reorder" }; return; }

  const ir = over.getBoundingClientRect();
  const cx = ir.left + ir.width / 2, cy = ir.top + ir.height / 2;
  const inCenter = Math.abs(e.clientX - cx) < ir.width * 0.32 && Math.abs(e.clientY - cy) < ir.height * 0.4;

  // default = live reorder; dwelling on an item's center arms folder-merge (iOS-style)
  if (inCenter) {
    if (press.dwellId !== over.dataset.id) {
      cancelDwell();
      press.dwellId = over.dataset.id;
      press.dwellTimer = setTimeout(() => {
        press.merge = press.dwellId;
        press.dropTarget = { type: "merge", id: press.merge };   // arm even if pointer stays still
        const el = $("grid").querySelector('[data-id="' + press.merge + '"]');
        if (el) el.classList.add("drop-merge");
      }, 500);
    }
    if (press.merge === over.dataset.id) { over.classList.add("drop-merge"); press.dropTarget = { type: "merge", id: over.dataset.id }; return; }
  } else {
    cancelDwell();
  }
  press.dropTarget = { type: "reorder" };
  reorderDom(over, e);
}

function endPress() {
  if (!press) return;
  clearTimeout(press.timer);
  if (press.dwellTimer) clearTimeout(press.dwellTimer);
  const p = press; press = null;
  if (!p.dragging) return;
  if (p.ghost) p.ghost.remove();
  p.itemEl && p.itemEl.classList.remove("drag-source");
  clearDropHints();
  justDragged = true; setTimeout(() => { justDragged = false; }, 80);
  const dt = p.dropTarget || { type: "reorder" };
  if (dt.type === "folder") {
    moveArtifacts([p.id], dt.id).then(() => { toast("폴더로 이동"); renderGrid(); });
  } else if (dt.type === "merge") {
    mergeIntoFolder(p.id, dt.id);
  } else {
    commitDomOrder();
  }
}

async function mergeIntoFolder(srcId, targetId) {
  const parent = (currentCollection !== "ALL" && currentCollection !== null) ? currentCollection : null;
  const c = await createCollection("새 폴더", parent);
  if (!c) { renderGrid(); return; }
  await moveArtifacts([srcId, targetId], c.id);
  setCollection(c.id);                                // navigate into the new folder
  toast('폴더 생성 — 이름은 "✎ 폴더명/삭제"에서 변경');
}

function commitDomOrder() {
  const gridEl = $("grid");
  const domIds = [...gridEl.children].map(el => el.dataset && el.dataset.id).filter(Boolean);
  if (!domIds.length) { renderGrid(); return; }
  const visible = new Set(domIds);
  const seq = domIds.map(id => store.artifacts.find(a => a.id === id));
  let i = 0;
  store.artifacts = store.artifacts.map(a => visible.has(a.id) ? seq[i++] : a);
  if (sortMode !== "manual") { sortMode = "manual"; $("sortSelect").value = "manual"; }
  persist().then(() => renderGrid()).catch(e => { toast(storageErr(e)); renderGrid(); });
}

// Suppress iOS long-press context menu / image save on cards while usable
$("grid").addEventListener("contextmenu", (e) => { if (arrangeMode || press) e.preventDefault(); });

// ===================== Boot =====================
if (!window.crypto || !crypto.subtle || !window.indexedDB) {
  document.body.innerHTML = '<div style="padding:40px;text-align:center">이 브라우저는 WebCrypto / IndexedDB를 지원하지 않습니다. HTTPS 환경의 최신 브라우저를 사용하세요.</div>';
} else {
  initLockScreen();
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
}
</script>
</body>
