<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0d1117" />
<title>Artifact Gallery</title>

<!-- Icons / PWA -->
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Gallery" />
<style>
  :root {
    --bg: #0d1117;
    --bg-elev: #161b22;
    --bg-elev2: #1c2129;
    --border: #2a313c;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #6e9eff;
    --accent-hover: #84b0ff;
    --danger: #f87171;
    --green: #3fb950;
    --radius: 12px;
    --shadow: 0 8px 30px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  /* No overflow-x:clip/hidden on the root: on iOS Safari that breaks the
     sticky header (WebKit treats it as a scroll container). Instead the
     layout is built so nothing exceeds the viewport width in the first place. */
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo",
      "Noto Sans KR", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  button { font-family: inherit; cursor: pointer; }
  input, textarea { font-family: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border);
    background: var(--bg-elev2);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 500;
    transition: background .15s, border-color .15s, transform .05s;
  }
  .btn:hover { background: #232a33; border-color: #3a424e; }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0b1020; font-weight: 600; }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn.danger { color: var(--danger); border-color: #5c2b2b; background: #2a1818; }
  .btn.danger:hover { background: #3a1f1f; }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover { background: var(--bg-elev2); }
  .btn.sm { padding: 6px 10px; font-size: 13px; }

  .hidden { display: none !important; }

  /* ---------- Lock screen ---------- */
  #lock {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1200px 600px at 50% -10%, #16203a 0%, var(--bg) 55%);
    z-index: 100;
    padding: 24px;
  }
  .lock-card {
    width: 100%; max-width: 380px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: var(--shadow);
    text-align: center;
  }
  .lock-card .logo { font-size: 40px; margin-bottom: 8px; }
  .lock-card h1 { font-size: 21px; margin: 0 0 6px; }
  .lock-card p { color: var(--text-dim); font-size: 13.5px; margin: 0 0 22px; }
  .field { text-align: left; margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--text-dim); margin-bottom: 6px; }
  .field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 11px 12px;
    border-radius: 9px;
    font-size: 15px;
    outline: none;
  }
  .field input:focus { border-color: var(--accent); }
  .lock-msg { font-size: 13px; min-height: 18px; margin: -2px 0 12px; }
  .lock-msg.error { color: var(--danger); }
  .lock-msg.ok { color: var(--green); }
  .lock-actions { display: flex; flex-direction: column; gap: 10px; }
  .lock-footer { margin-top: 18px; font-size: 12px; color: var(--text-dim); }
  .lock-footer a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .lock-footer a:hover { text-decoration: underline; }

  /* ---------- App ---------- */
  #app { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
  header.top {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 14px;
    padding: 12px 20px;
    background: rgba(13,17,23,.85);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 16px; }
  .brand .dot { font-size: 20px; }
  .search {
    flex: 1; max-width: 420px;
    display: flex; align-items: center; gap: 8px;
    background: var(--bg-elev2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 7px 12px;
  }
  .search input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-size: 14px; }
  .search .ic { color: var(--text-dim); }
  .spacer { flex: 1; }
  .count-pill { font-size: 12.5px; color: var(--text-dim); padding: 2px 0; }

  .select {
    background: var(--bg-elev2); color: var(--text);
    border: 1px solid var(--border); border-radius: 9px;
    padding: 8px 10px; font-size: 13.5px; outline: none;
  }
  .select:focus { border-color: var(--accent); }

  .filter-bar, .bulk-bar {
    max-width: 1280px; margin: 0 auto; width: 100%;
    padding: 10px 20px 0;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .bulk-bar {
    position: sticky; top: 57px; z-index: 15;
    background: rgba(13,17,23,.9); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border); padding: 10px 20px;
  }
  .bulk-check { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; }
  .tag-chip {
    font-size: 12.5px; padding: 5px 11px; border-radius: 20px;
    background: var(--bg-elev2); border: 1px solid var(--border); color: var(--text-dim);
  }
  .tag-chip:hover { border-color: #3a424e; color: var(--text); }
  .tag-chip.active { background: var(--accent); border-color: var(--accent); color: #0b1020; font-weight: 600; }

  main { flex: 1; padding: 22px 20px 60px; max-width: 1280px; margin: 0 auto; width: 100%; }

  .card.selectable .thumb { cursor: default; }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .sel-box {
    position: absolute; top: 8px; right: 8px; z-index: 3;
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(20,25,33,.92); border: 1px solid var(--border); border-radius: 6px;
  }
  .sel-box input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .card-tags .t {
    font-size: 10.5px; padding: 2px 7px; border-radius: 12px;
    background: var(--bg-elev2); border: 1px solid var(--border); color: var(--text-dim);
  }

  .empty {
    text-align: center; color: var(--text-dim);
    padding: 80px 20px;
  }
  .empty .big { font-size: 46px; margin-bottom: 12px; opacity: .8; }
  .empty h2 { color: var(--text); font-weight: 600; margin: 0 0 8px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex; flex-direction: column;
    transition: border-color .15s, transform .1s;
  }
  .card:hover { border-color: #3a4658; transform: translateY(-2px); }
  .thumb {
    position: relative;
    height: 165px;
    background: #0a0d12;
    overflow: hidden;
    /* iOS Safari ignores overflow:hidden for <iframe> and expands it to its
       content width (often 980px for viewport-less artifacts), which leaks out
       and causes horizontal page scroll until a reflow. Layout+paint
       containment forces the iframe to stay inside the thumbnail box. */
    contain: layout paint;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }
  .thumb .frame-wrap {
    position: absolute; top: 0; left: 0;
    width: 200%; height: 200%;
    transform: scale(.5);
    transform-origin: top left;
    pointer-events: none;
  }
  .thumb iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  .thumb .link-thumb {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; color: var(--text-dim); padding: 16px; text-align: center;
  }
  .thumb .link-thumb .ic { font-size: 34px; }
  .thumb .link-thumb .url { font-size: 12px; word-break: break-all; color: var(--accent); }
  .thumb .overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(8,11,16,.0);
    transition: background .15s;
  }
  .thumb:hover .overlay { background: rgba(8,11,16,.45); }
  .thumb .overlay span {
    opacity: 0; transition: opacity .15s;
    background: rgba(20,25,33,.9); border: 1px solid var(--border);
    padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
  }
  .thumb:hover .overlay span { opacity: 1; }
  .type-badge {
    position: absolute; top: 8px; left: 8px;
    font-size: 11px; font-weight: 600;
    padding: 3px 8px; border-radius: 20px;
    background: rgba(20,25,33,.9); border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .card-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
  .card-title { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-meta { font-size: 12px; color: var(--text-dim); }
  .card-actions { display: flex; gap: 6px; padding: 0 14px 12px; }
  .card-actions .btn { flex: 1; justify-content: center; }

  /* ---------- Modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(2,4,8,.7);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 100%; max-width: 600px;
    max-height: 90vh; overflow: auto;
    box-shadow: var(--shadow);
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--bg-elev); z-index: 1;
  }
  .modal-head h2 { font-size: 17px; margin: 0; }
  .modal-body { padding: 20px; }
  .modal-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 0 20px 20px; }

  .tabs { display: flex; gap: 6px; margin-bottom: 18px; background: var(--bg); padding: 4px; border-radius: 10px; }
  .tab { flex: 1; text-align: center; padding: 8px; border-radius: 7px; font-size: 13.5px; color: var(--text-dim); border: none; background: transparent; }
  .tab.active { background: var(--bg-elev2); color: var(--text); font-weight: 600; }

  textarea.code {
    width: 100%; min-height: 200px;
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 9px; padding: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px; resize: vertical; outline: none;
  }
  textarea.code:focus, .modal-body input[type=text]:focus { border-color: var(--accent); }
  .modal-body input[type=text] {
    width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 11px 12px; border-radius: 9px; font-size: 14px; outline: none;
  }
  .modal-body label.lbl { display: block; font-size: 12.5px; color: var(--text-dim); margin: 14px 0 6px; }
  .modal-body label.lbl:first-child { margin-top: 0; }

  .dropzone {
    border: 2px dashed var(--border); border-radius: 12px;
    padding: 36px 20px; text-align: center; color: var(--text-dim);
    transition: border-color .15s, background .15s; cursor: pointer;
  }
  .dropzone.drag { border-color: var(--accent); background: rgba(110,158,255,.08); }
  .dropzone .ic { font-size: 36px; display: block; margin-bottom: 8px; }
  .dropzone .fname { color: var(--green); margin-top: 8px; font-size: 13px; }

  /* ---------- Viewer ---------- */
  #viewer {
    position: fixed; inset: 0; z-index: 80;
    background: var(--bg);
    display: flex; flex-direction: column;
  }
  .viewer-bar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    background: var(--bg-elev);
  }
  .viewer-bar .vtitle { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #viewer iframe { flex: 1; width: 100%; border: 0; background: #fff; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--bg-elev2); border: 1px solid var(--border);
    color: var(--text); padding: 11px 18px; border-radius: 10px;
    font-size: 13.5px; z-index: 200; box-shadow: var(--shadow);
    opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  .hint { font-size: 12px; color: var(--text-dim); margin-top: 6px; line-height: 1.5; }

  /* ---------- Responsive (mobile / narrow) ---------- */
  /* Breakpoint at 760px: the single-row desktop header needs ~700px, so below
     that we switch to a deterministic two-row CSS grid. Grid (rather than
     flex-wrap + order tricks) guarantees the header never overflows: the
     minmax(0,1fr) search column is allowed to shrink below its content width,
     which flexbox min-width handling does inconsistently across engines
     (notably iOS Safari). */
  @media (max-width: 760px) {
    header.top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      grid-template-areas:
        "brand  add  menu"
        "search sort select";
      gap: 8px 8px;
      padding: 10px 12px;
      align-items: center;
    }
    .brand { grid-area: brand; min-width: 0; font-size: 15px; }
    .brand span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #addBtn { grid-area: add; }
    #menuBtn { grid-area: menu; }
    .search { grid-area: search; max-width: none; min-width: 0; }
    .search input { min-width: 0; }
    #sortSelect { grid-area: sort; }
    #selectBtn { grid-area: select; }
    .count-pill, header.top .spacer { display: none; }

    .bulk-bar { top: auto; }
    .filter-bar, .bulk-bar { padding-left: 12px; padding-right: 12px; }

    main { padding: 16px 12px 60px; }
    .grid {
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr));
      gap: 14px;
    }

    .viewer-bar { gap: 8px; padding: 10px 12px; }
    .viewer-bar .vtitle { flex: 1; min-width: 0; }
    #viewerNewTab { white-space: nowrap; }
  }
</style>
</head>
<body>

<!-- ============ LOCK SCREEN ============ -->
<div id="lock">
  <div class="lock-card">
    <div class="logo">🔐</div>
    <h1 id="lockTitle">갤러리 잠금 해제</h1>
    <p id="lockSub">비밀번호를 입력해 아티팩트를 복호화하세요.</p>
    <form id="lockForm" autocomplete="off">
      <div class="field">
        <label for="pw">비밀번호</label>
        <input id="pw" type="password" autocomplete="current-password" />
      </div>
      <div class="field hidden" id="pw2Field">
        <label for="pw2">비밀번호 확인</label>
        <input id="pw2" type="password" autocomplete="new-password" />
      </div>
      <div class="lock-msg" id="lockMsg"></div>
      <div class="lock-actions">
        <button class="btn primary" type="submit" id="lockBtn">잠금 해제</button>
      </div>
    </form>
    <div class="lock-footer">
      <span id="setupHint" class="hidden">처음 사용하시는군요. 새 비밀번호를 설정하세요.<br>이 비밀번호로 모든 아티팩트가 암호화됩니다. <b>분실 시 복구 불가</b>.</span>
      <span id="restoreLink"><a id="importVaultLink">백업 파일에서 복원</a></span>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header class="top">
    <div class="brand"><span class="dot">🎨</span><span>Artifact Gallery</span></div>
    <div class="search">
      <span class="ic">🔎</span>
      <input id="searchInput" type="text" placeholder="제목 검색…" />
    </div>
    <span class="count-pill" id="countPill"></span>
    <div class="spacer"></div>
    <select id="sortSelect" class="select">
      <option value="new">최신순</option>
      <option value="old">오래된순</option>
      <option value="title">이름순</option>
    </select>
    <button class="btn" id="selectBtn">☑ 선택</button>
    <button class="btn primary" id="addBtn">＋ 추가</button>
    <button class="btn" id="menuBtn">⋯</button>
  </header>

  <div id="filterBar" class="filter-bar hidden"></div>

  <div id="bulkBar" class="bulk-bar hidden">
    <label class="bulk-check"><input type="checkbox" id="selectAll" /> 전체 선택</label>
    <span id="selCount" class="count-pill">0개 선택</span>
    <div class="spacer"></div>
    <button class="btn sm" id="bulkExport">⬇ 내보내기</button>
    <button class="btn sm danger" id="bulkDelete">🗑 삭제</button>
    <button class="btn sm ghost" id="selectCancel">완료</button>
  </div>

  <main>
    <div id="emptyState" class="empty hidden">
      <div class="big">📦</div>
      <h2>아직 아티팩트가 없어요</h2>
      <p>오른쪽 위 <b>＋ 추가</b> 버튼으로 첫 아티팩트를 올려보세요.</p>
    </div>
    <div id="grid" class="grid"></div>
  </main>
</div>

<!-- ============ VIEWER ============ -->
<div id="viewer" class="hidden">
  <div class="viewer-bar">
    <button class="btn sm" id="viewerBack">← 뒤로</button>
    <span class="vtitle" id="viewerTitle"></span>
    <div class="spacer"></div>
    <button class="btn sm" id="viewerNewTab">새 탭에서 열기 ↗</button>
  </div>
  <iframe id="viewerFrame" sandbox="allow-scripts allow-popups allow-forms allow-modals allow-downloads"></iframe>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

// ===================== Storage + crypto =====================
const STORAGE_KEY = "arti.vault.v1";          // legacy localStorage key (auto-migrated)
const IDB_NAME = "arti", IDB_STORE = "kv", VAULT_ID = "vault";
const enc = new TextEncoder();
const dec = new TextDecoder();

// chunked base64 so huge buffers don't blow the call stack (used for backups)
const b64 = (bytes) => {
  const u = new Uint8Array(bytes); let s = "";
  for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(s);
};
const ub64 = (str) => Uint8Array.from(atob(str), c => c.charCodeAt(0));

// ---- IndexedDB key/value store (large quota, unlike localStorage's ~5MB) ----
let _dbPromise = null;
function idb() {
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((res, rej) => {
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(IDB_STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return _dbPromise;
}
async function idbGet(key) {
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction(IDB_STORE, "readonly").objectStore(IDB_STORE).get(key);
    t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error);
  });
}
async function idbSet(key, val) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error || new DOMException("aborted", "AbortError"));
  });
}
async function idbDel(key) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}

// ---- gzip compression (CompressionStream: Safari 16.4+, Chrome 80+); no-op fallback ----
async function gzip(bytes) {
  if (typeof CompressionStream === "undefined") return { data: bytes, comp: false };
  const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"));
  return { data: new Uint8Array(await new Response(stream).arrayBuffer()), comp: true };
}
async function gunzip(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function deriveKey(password, salt) {
  const baseKey = await crypto.subtle.importKey(
    "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
  );
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: 250000, hash: "SHA-256" },
    baseKey,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}

function storageErr(e) {
  const name = (e && e.name) || "";
  if (name === "QuotaExceededError" || /quota|exceeded/i.test((e && e.message) || ""))
    return "저장 공간이 부족합니다. 백업 후 일부 아티팩트를 삭제해 주세요.";
  return "저장에 실패했습니다: " + ((e && e.message) || e);
}

// ===================== State =====================
let cryptoKey = null;        // in-memory AES key (cleared on lock)
let saltB64 = null;          // current salt
let store = { artifacts: [] };

// view state
let sortMode = "new";
let tagFilter = null;        // active tag, or null
let selectMode = false;
let selected = new Set();

// Internal vault shape: { v, salt:b64, iv:b64, comp:bool, ct:ArrayBuffer }
async function readVault() {
  const v = await idbGet(VAULT_ID);
  if (v) return v;
  // migrate legacy localStorage vault (v1: all-b64 strings, uncompressed)
  try {
    const old = localStorage.getItem(STORAGE_KEY);
    if (old) {
      const o = JSON.parse(old);
      if (o && o.salt && o.iv && o.ct)
        return { v: 1, salt: o.salt, iv: o.iv, comp: false, ct: ub64(o.ct).buffer };
    }
  } catch {}
  return null;
}
async function writeVault(v) { await idbSet(VAULT_ID, v); }

async function persist() {
  const plain = enc.encode(JSON.stringify(store));
  const { data, comp } = await gzip(plain);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, cryptoKey, data);
  await writeVault({ v: 2, salt: saltB64, iv: b64(iv), comp, ct });
}

async function decryptVault(key, vault) {
  const ctBuf = vault.ct instanceof ArrayBuffer ? vault.ct : ub64(vault.ct).buffer;
  const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub64(vault.iv) }, key, ctBuf);
  let bytes = new Uint8Array(buf);
  if (vault.comp) bytes = await gunzip(bytes);
  return JSON.parse(dec.decode(bytes));
}

// ===================== Lock screen logic =====================
const $ = (id) => document.getElementById(id);
const lockEl = $("lock"), appEl = $("app");
let isSetup = false;

async function initLockScreen() {
  const vault = await readVault();
  isSetup = !vault;
  if (isSetup) {
    $("lockTitle").textContent = "비밀번호 설정";
    $("lockSub").textContent = "갤러리를 보호할 마스터 비밀번호를 만드세요.";
    $("lockBtn").textContent = "비밀번호 생성";
    $("pw2Field").classList.remove("hidden");
    $("setupHint").classList.remove("hidden");
    $("restoreLink").classList.remove("hidden");
  } else {
    $("lockTitle").textContent = "갤러리 잠금 해제";
    $("lockSub").textContent = "비밀번호를 입력해 아티팩트를 복호화하세요.";
    $("lockBtn").textContent = "잠금 해제";
    $("pw2Field").classList.add("hidden");
    $("setupHint").classList.add("hidden");
  }
  setTimeout(() => $("pw").focus(), 50);
}

function lockMsg(text, kind) {
  const el = $("lockMsg");
  el.textContent = text || "";
  el.className = "lock-msg" + (kind ? " " + kind : "");
}

$("lockForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = $("pw").value;
  if (!pw) { lockMsg("비밀번호를 입력하세요.", "error"); return; }
  $("lockBtn").disabled = true;

  try {
    if (isSetup) {
      if (pw.length < 4) { lockMsg("4자 이상으로 설정하세요.", "error"); return; }
      if (pw !== $("pw2").value) { lockMsg("비밀번호가 일치하지 않습니다.", "error"); return; }
      const salt = crypto.getRandomValues(new Uint8Array(16));
      saltB64 = b64(salt);
      cryptoKey = await deriveKey(pw, salt);
      store = { artifacts: [] };
      await persist();
      enterApp();
    } else {
      const vault = await readVault();
      saltB64 = vault.salt;
      const key = await deriveKey(pw, ub64(vault.salt));
      let data;
      try {
        data = await decryptVault(key, vault);
      } catch {
        lockMsg("비밀번호가 올바르지 않습니다.", "error");
        return;
      }
      cryptoKey = key;
      store = data && data.artifacts ? data : { artifacts: [] };
      // upgrade a legacy (localStorage / uncompressed) vault to IndexedDB + gzip
      if (vault.v !== 2) {
        try { await persist(); localStorage.removeItem(STORAGE_KEY); } catch {}
      }
      enterApp();
    }
  } finally {
    $("lockBtn").disabled = false;
    $("pw").value = ""; $("pw2").value = "";
  }
});

function enterApp() {
  lockMsg("");
  lockEl.classList.add("hidden");
  appEl.classList.remove("hidden");
  renderGrid();
}

function lockApp() {
  cryptoKey = null; store = { artifacts: [] };
  selectMode = false; selected.clear(); tagFilter = null;
  $("bulkBar").classList.add("hidden");
  appEl.classList.add("hidden");
  $("viewer").classList.add("hidden");
  lockEl.classList.remove("hidden");
  initLockScreen();
}

// ===================== Artifacts CRUD =====================
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

async function addArtifact(a) {
  store.artifacts.unshift({ id: uid(), createdAt: Date.now(), ...a });
  try { await persist(); }
  catch (e) { store.artifacts.shift(); renderGrid(); throw e; }   // roll back on quota/error
  renderGrid();
}
async function deleteArtifact(id) {
  store.artifacts = store.artifacts.filter(a => a.id !== id);
  await persist();
  renderGrid();
}
async function updateArtifact(id, patch) {
  const a = store.artifacts.find(x => x.id === id);
  if (!a) return;
  const backup = { ...a };
  Object.assign(a, patch, { updatedAt: Date.now() });
  try { await persist(); }
  catch (e) { Object.assign(a, backup); renderGrid(); throw e; }  // roll back on quota/error
  renderGrid();
}
function parseTags(str) {
  return [...new Set((str || "").split(",").map(s => s.trim()).filter(Boolean))];
}

// ===================== Rendering =====================
function fmtDate(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
}
function esc(s) { return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function allTags() {
  const set = new Set();
  store.artifacts.forEach(a => (a.tags || []).forEach(t => set.add(t)));
  return [...set].sort((x, y) => x.localeCompare(y, "ko"));
}

function renderFilterBar() {
  const bar = $("filterBar");
  const tags = allTags();
  if (tags.length === 0) { bar.classList.add("hidden"); bar.innerHTML = ""; return; }
  bar.classList.remove("hidden");
  bar.innerHTML =
    `<button class="tag-chip ${tagFilter === null ? "active" : ""}" data-tag="">전체</button>` +
    tags.map(t => `<button class="tag-chip ${tagFilter === t ? "active" : ""}" data-tag="${esc(t)}">🏷 ${esc(t)}</button>`).join("");
  bar.querySelectorAll(".tag-chip").forEach(c => {
    c.onclick = () => { tagFilter = c.dataset.tag || null; renderFilterBar(); renderGrid(); };
  });
}

function visibleArtifacts() {
  const q = $("searchInput").value.trim().toLowerCase();
  let items = store.artifacts.filter(a => {
    if (q && !(a.title || "").toLowerCase().includes(q)) return false;
    if (tagFilter && !(a.tags || []).includes(tagFilter)) return false;
    return true;
  });
  if (sortMode === "new") items.sort((a, b) => b.createdAt - a.createdAt);
  else if (sortMode === "old") items.sort((a, b) => a.createdAt - b.createdAt);
  else if (sortMode === "title") items.sort((a, b) => (a.title || "").localeCompare(b.title || "", "ko"));
  return items;
}

function renderGrid() {
  renderFilterBar();
  const items = visibleArtifacts();
  $("countPill").textContent = `${store.artifacts.length}개`;

  const grid = $("grid"), empty = $("emptyState");
  grid.innerHTML = "";
  if (store.artifacts.length === 0) { empty.classList.remove("hidden"); updateBulkBar(); return; }
  empty.classList.add("hidden");

  if (items.length === 0) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="big">🔍</div><h2>결과 없음</h2></div>`;
    updateBulkBar(); return;
  }

  for (const a of items) {
    const card = document.createElement("div");
    card.className = "card" + (selectMode ? " selectable" : "") + (selected.has(a.id) ? " selected" : "");
    const isLink = a.type === "link";
    const badge = isLink ? "🔗 링크" : "📄 HTML";

    let thumbInner;
    if (isLink) {
      thumbInner = `<div class="link-thumb"><span class="ic">🔗</span><span class="url">${esc(a.content)}</span></div>`;
    } else {
      thumbInner = `<div class="frame-wrap"><iframe sandbox="allow-scripts" loading="lazy" scrolling="no"></iframe></div>`;
    }

    const tagsHtml = (a.tags && a.tags.length)
      ? `<div class="card-tags">${a.tags.map(t => `<span class="t">${esc(t)}</span>`).join("")}</div>` : "";
    const selBox = selectMode
      ? `<div class="sel-box"><input type="checkbox" data-sel="${a.id}" ${selected.has(a.id) ? "checked" : ""}></div>` : "";

    card.innerHTML = `
      <div class="thumb" data-id="${a.id}">
        <span class="type-badge">${badge}</span>
        ${selBox}
        ${thumbInner}
        <div class="overlay"><span>${isLink ? "열기 ↗" : "보기"}</span></div>
      </div>
      <div class="card-body">
        <div class="card-title" title="${esc(a.title)}">${esc(a.title || "(제목 없음)")}</div>
        <div class="card-meta">${fmtDate(a.createdAt)}</div>
        ${tagsHtml}
      </div>
      <div class="card-actions">
        <button class="btn sm" data-act="open" data-id="${a.id}">열기</button>
        <button class="btn sm" data-act="edit" data-id="${a.id}">✏️</button>
        <button class="btn sm" data-act="download" data-id="${a.id}">⬇</button>
        <button class="btn sm danger" data-act="delete" data-id="${a.id}">🗑</button>
      </div>`;
    grid.appendChild(card);

    if (!isLink) card.querySelector("iframe").srcdoc = a.content;
  }
  updateBulkBar();
}

// Grid click delegation
$("grid").addEventListener("click", (e) => {
  const selCb = e.target.closest("[data-sel]");
  if (selCb) { toggleSelect(selCb.dataset.sel); return; }

  const actBtn = e.target.closest("[data-act]");
  if (actBtn) {
    const a = store.artifacts.find(x => x.id === actBtn.dataset.id);
    if (!a) return;
    const act = actBtn.dataset.act;
    if (act === "open") openArtifact(a);
    else if (act === "edit") openEditModal(a);
    else if (act === "download") downloadArtifact(a);
    else if (act === "delete") confirmDelete(a);
    return;
  }

  const thumb = e.target.closest(".thumb");
  if (thumb) {
    if (selectMode) { toggleSelect(thumb.dataset.id); return; }
    const a = store.artifacts.find(x => x.id === thumb.dataset.id);
    if (a) openArtifact(a);
  }
});

// ===================== Selection / bulk =====================
function toggleSelect(id) {
  if (selected.has(id)) selected.delete(id); else selected.add(id);
  renderGrid();
}
function setSelectMode(on) {
  selectMode = on;
  selected.clear();
  $("bulkBar").classList.toggle("hidden", !on);
  $("selectBtn").classList.toggle("primary", on);
  $("selectBtn").textContent = on ? "✕ 선택 취소" : "☑ 선택";
  renderGrid();
}
function updateBulkBar() {
  if (!selectMode) return;
  $("selCount").textContent = `${selected.size}개 선택`;
  const vis = visibleArtifacts();
  $("selectAll").checked = vis.length > 0 && vis.every(a => selected.has(a.id));
}
$("selectBtn").addEventListener("click", () => setSelectMode(!selectMode));
$("selectCancel").addEventListener("click", () => setSelectMode(false));
$("selectAll").addEventListener("change", (e) => {
  const vis = visibleArtifacts();
  if (e.target.checked) vis.forEach(a => selected.add(a.id));
  else vis.forEach(a => selected.delete(a.id));
  renderGrid();
});
$("bulkDelete").addEventListener("click", async () => {
  if (selected.size === 0) { toast("선택된 항목이 없습니다"); return; }
  if (!confirm(`선택한 ${selected.size}개를 삭제할까요?`)) return;
  store.artifacts = store.artifacts.filter(a => !selected.has(a.id));
  await persist();
  setSelectMode(false);
  toast("삭제 완료");
});
$("bulkExport").addEventListener("click", () => {
  if (selected.size === 0) { toast("선택된 항목이 없습니다"); return; }
  const subset = store.artifacts.filter(a => selected.has(a.id));
  const blob = new Blob([JSON.stringify({ exported: Date.now(), artifacts: subset }, null, 2)], { type: "application/json" });
  triggerDownload(blob, `artifacts-${selected.size}개-${fmtDate(Date.now())}.json`);
  toast(`${selected.size}개 내보냄 (평문 JSON)`);
});

$("sortSelect").addEventListener("change", (e) => { sortMode = e.target.value; renderGrid(); });

function openArtifact(a) {
  if (a.type === "link") { window.open(a.content, "_blank", "noopener"); return; }
  $("viewerTitle").textContent = a.title || "(제목 없음)";
  $("viewerFrame").srcdoc = a.content;
  $("viewer").dataset.id = a.id;
  $("viewer").classList.remove("hidden");
}

function downloadArtifact(a) {
  let blob, name;
  if (a.type === "link") {
    blob = new Blob([a.content], { type: "text/plain" });
    name = (a.title || "link") + ".txt";
  } else {
    blob = new Blob([a.content], { type: "text/html" });
    name = (a.title || "artifact").replace(/[^\w가-힣 .-]/g, "_") + ".html";
  }
  triggerDownload(blob, name);
}
function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function confirmDelete(a) {
  if (confirm(`"${a.title || "(제목 없음)"}" 을(를) 삭제할까요?`)) {
    deleteArtifact(a.id);
    toast("삭제됨");
  }
}

// Viewer controls
$("viewerBack").addEventListener("click", () => {
  $("viewer").classList.add("hidden");
  $("viewerFrame").srcdoc = "";
});
$("viewerNewTab").addEventListener("click", () => {
  const a = store.artifacts.find(x => x.id === $("viewer").dataset.id);
  if (!a) return;
  const blob = new Blob([a.content], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  window.open(url, "_blank", "noopener");
  setTimeout(() => URL.revokeObjectURL(url), 10000);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("viewer").classList.contains("hidden")) {
    $("viewerBack").click();
  }
});

// ===================== Add modal =====================
let modalEl = null;
$("addBtn").addEventListener("click", openAddModal);
$("searchInput").addEventListener("input", renderGrid);

function closeModal() { if (modalEl) { modalEl.remove(); modalEl = null; } }

function openAddModal() {
  let tab = "paste";
  let fileContent = null, fileName = "";

  modalEl = document.createElement("div");
  modalEl.className = "modal-backdrop";
  modalEl.innerHTML = `
    <div class="modal" id="addModal">
      <div class="modal-head">
        <h2>아티팩트 추가</h2>
        <button class="btn ghost" id="mClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="tabs">
          <button class="tab active" data-tab="paste">📝 코드 붙여넣기</button>
          <button class="tab" data-tab="upload">📁 파일 업로드</button>
          <button class="tab" data-tab="link">🔗 링크</button>
        </div>

        <label class="lbl">제목</label>
        <input type="text" id="mTitle" placeholder="아티팩트 제목" />

        <label class="lbl">태그 <span style="opacity:.6">(쉼표로 구분, 선택)</span></label>
        <input type="text" id="mTags" placeholder="예: 대시보드, 게임, 실험" />

        <div class="pane" data-pane="paste">
          <label class="lbl">HTML 코드</label>
          <textarea class="code" id="mCode" placeholder="<!DOCTYPE html> ... Claude 아티팩트 HTML 전체를 붙여넣으세요"></textarea>
        </div>

        <div class="pane hidden" data-pane="upload">
          <label class="lbl">.html 파일</label>
          <div class="dropzone" id="mDrop">
            <span class="ic">📁</span>
            <div>클릭하거나 파일을 여기로 드래그</div>
            <div class="fname" id="mFname"></div>
          </div>
          <input type="file" id="mFile" accept=".html,.htm,text/html" class="hidden" />
        </div>

        <div class="pane hidden" data-pane="link">
          <label class="lbl">URL</label>
          <input type="text" id="mUrl" placeholder="https://..." />
          <div class="hint">외부 아티팩트 주소를 북마크처럼 저장합니다. (내용은 저장되지 않고 링크만 저장)</div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="mCancel">취소</button>
        <button class="btn primary" id="mSave">저장</button>
      </div>
    </div>`;
  document.body.appendChild(modalEl);

  modalEl.addEventListener("click", (e) => { if (e.target === modalEl) closeModal(); });
  $("mClose").onclick = closeModal;
  $("mCancel").onclick = closeModal;

  // tab switching
  modalEl.querySelectorAll(".tab").forEach(btn => {
    btn.onclick = () => {
      tab = btn.dataset.tab;
      modalEl.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b === btn));
      modalEl.querySelectorAll(".pane").forEach(p => p.classList.toggle("hidden", p.dataset.pane !== tab));
    };
  });

  // file upload
  const drop = $("mDrop"), fileInput = $("mFile");
  drop.onclick = () => fileInput.click();
  fileInput.onchange = () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); };
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("drag"); };
  drop.ondragleave = () => drop.classList.remove("drag");
  drop.ondrop = (e) => {
    e.preventDefault(); drop.classList.remove("drag");
    if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
  };
  function loadFile(file) {
    fileName = file.name;
    const reader = new FileReader();
    reader.onload = () => {
      fileContent = reader.result;
      $("mFname").textContent = "✓ " + fileName;
      if (!$("mTitle").value) $("mTitle").value = fileName.replace(/\.html?$/i, "");
    };
    reader.readAsText(file);
  }

  // save
  $("mSave").onclick = async () => {
    const title = $("mTitle").value.trim();
    const tags = parseTags($("mTags").value);
    let art;
    if (tab === "paste") {
      const code = $("mCode").value.trim();
      if (!code) { toast("HTML 코드를 입력하세요"); return; }
      art = { type: "html", title: title || "붙여넣은 아티팩트", content: code, tags };
    } else if (tab === "upload") {
      if (!fileContent) { toast("파일을 선택하세요"); return; }
      art = { type: "html", title: title || fileName.replace(/\.html?$/i, ""), content: fileContent, tags };
    } else {
      let url = $("mUrl").value.trim();
      if (!url) { toast("URL을 입력하세요"); return; }
      if (!/^https?:\/\//i.test(url)) url = "https://" + url;
      art = { type: "link", title: title || url, content: url, tags };
    }
    $("mSave").disabled = true;
    try {
      await addArtifact(art);
      closeModal();
      toast("추가됨 ✓");
    } catch (e) {
      $("mSave").disabled = false;
      toast(storageErr(e));
    }
  };

  setTimeout(() => $("mTitle").focus(), 50);
}

// ===================== Edit modal =====================
function openEditModal(a) {
  const isLink = a.type === "link";
  modalEl = document.createElement("div");
  modalEl.className = "modal-backdrop";
  modalEl.innerHTML = `
    <div class="modal">
      <div class="modal-head"><h2>아티팩트 편집</h2><button class="btn ghost" id="mClose">✕</button></div>
      <div class="modal-body">
        <label class="lbl">제목</label>
        <input type="text" id="eTitle" value="${esc(a.title || "")}" />
        <label class="lbl">태그 <span style="opacity:.6">(쉼표로 구분)</span></label>
        <input type="text" id="eTags" value="${esc((a.tags || []).join(", "))}" />
        <label class="lbl">${isLink ? "URL" : "HTML 코드"}</label>
        ${isLink
          ? `<input type="text" id="eContent" value="${esc(a.content)}" />`
          : `<textarea class="code" id="eContent">${esc(a.content)}</textarea>`}
      </div>
      <div class="modal-foot">
        <button class="btn" id="mCancel">취소</button>
        <button class="btn primary" id="mSave">저장</button>
      </div>
    </div>`;
  document.body.appendChild(modalEl);
  modalEl.addEventListener("click", (e) => { if (e.target === modalEl) closeModal(); });
  $("mClose").onclick = closeModal; $("mCancel").onclick = closeModal;
  $("mSave").onclick = async () => {
    let content = $("eContent").value.trim();
    if (!content) { toast("내용을 입력하세요"); return; }
    if (isLink && !/^https?:\/\//i.test(content)) content = "https://" + content;
    $("mSave").disabled = true;
    try {
      await updateArtifact(a.id, {
        title: $("eTitle").value.trim() || "(제목 없음)",
        tags: parseTags($("eTags").value),
        content
      });
      closeModal();
      toast("수정됨 ✓");
    } catch (e) {
      $("mSave").disabled = false;
      toast(storageErr(e));
    }
  };
  setTimeout(() => $("eTitle").focus(), 50);
}

// ===================== Menu (settings) =====================
$("menuBtn").addEventListener("click", openMenu);

function openMenu() {
  modalEl = document.createElement("div");
  modalEl.className = "modal-backdrop";
  modalEl.innerHTML = `
    <div class="modal" style="max-width:440px">
      <div class="modal-head"><h2>설정 · 백업</h2><button class="btn ghost" id="mClose">✕</button></div>
      <div class="modal-body" style="display:flex;flex-direction:column;gap:10px">
        <button class="btn" id="optExport">⬇ 암호화 백업 내보내기</button>
        <div class="hint">전체 갤러리를 암호화된 파일 하나로 저장합니다. 다른 기기에서 잠금화면의 "백업 파일에서 복원"으로 가져오면 동기화돼요.</div>
        <button class="btn" id="optImport" style="margin-top:8px">⬆ 아티팩트 가져오기 (JSON)</button>
        <div class="hint">선택 모드에서 "내보내기"로 만든 JSON 파일의 아티팩트를 현재 갤러리에 추가합니다.</div>
        <button class="btn" id="optChangePw" style="margin-top:8px">🔑 비밀번호 변경</button>
        <button class="btn" id="optLock">🔒 지금 잠그기</button>
        <button class="btn danger" id="optWipe" style="margin-top:8px">⚠ 이 브라우저에서 전체 삭제</button>
        <div class="hint">이 기기(브라우저)에 저장된 모든 데이터를 지웁니다. 백업이 없으면 복구 불가.</div>
      </div>
    </div>`;
  document.body.appendChild(modalEl);
  modalEl.addEventListener("click", (e) => { if (e.target === modalEl) closeModal(); });
  $("mClose").onclick = closeModal;

  $("optExport").onclick = async () => {
    const vault = await readVault();
    if (!vault) { toast("내보낼 데이터가 없습니다"); return; }
    const out = {
      v: vault.v || 2, salt: vault.salt, iv: vault.iv, comp: !!vault.comp,
      ct: vault.ct instanceof ArrayBuffer ? b64(vault.ct) : vault.ct
    };
    const blob = new Blob([JSON.stringify(out)], { type: "application/json" });
    triggerDownload(blob, `artifact-gallery-backup-${fmtDate(Date.now())}.json`);
    toast("백업 내보냄 (암호화됨)");
  };
  $("optImport").onclick = () => {
    const input = document.createElement("input");
    input.type = "file"; input.accept = "application/json,.json";
    input.onchange = () => {
      const file = input.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        let list;
        try {
          const data = JSON.parse(reader.result);
          list = Array.isArray(data) ? data : data.artifacts;
          if (!Array.isArray(list)) throw new Error();
        } catch { toast("올바른 JSON이 아닙니다"); return; }
        let n = 0;
        for (const it of list) {
          if (!it.content || !it.type) continue;
          store.artifacts.unshift({
            id: uid(), createdAt: it.createdAt || Date.now(),
            type: it.type, title: it.title || "(제목 없음)",
            content: it.content, tags: Array.isArray(it.tags) ? it.tags : []
          });
          n++;
        }
        try {
          await persist();
          closeModal(); renderGrid();
          toast(`${n}개 가져옴 ✓`);
        } catch (e) {
          store.artifacts.splice(0, n); renderGrid();   // roll back the import
          toast(storageErr(e));
        }
      };
      reader.readAsText(file);
    };
    input.click();
  };
  $("optLock").onclick = () => { closeModal(); lockApp(); };
  $("optChangePw").onclick = () => { closeModal(); openChangePw(); };
  $("optWipe").onclick = async () => {
    if (confirm("정말 이 브라우저의 모든 데이터를 삭제할까요? 백업이 없으면 복구할 수 없습니다.")) {
      try { await idbDel(VAULT_ID); } catch {}
      localStorage.removeItem(STORAGE_KEY);
      closeModal(); lockApp();
      toast("삭제 완료");
    }
  };
}

function openChangePw() {
  modalEl = document.createElement("div");
  modalEl.className = "modal-backdrop";
  modalEl.innerHTML = `
    <div class="modal" style="max-width:400px">
      <div class="modal-head"><h2>비밀번호 변경</h2><button class="btn ghost" id="mClose">✕</button></div>
      <div class="modal-body">
        <label class="lbl">새 비밀번호</label>
        <input type="text" id="npw" style="-webkit-text-security:disc" />
        <label class="lbl">새 비밀번호 확인</label>
        <input type="text" id="npw2" style="-webkit-text-security:disc" />
        <div class="hint">전체 아티팩트가 새 비밀번호로 다시 암호화됩니다.</div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="mCancel">취소</button>
        <button class="btn primary" id="mSave">변경</button>
      </div>
    </div>`;
  document.body.appendChild(modalEl);
  modalEl.addEventListener("click", (e) => { if (e.target === modalEl) closeModal(); });
  $("mClose").onclick = closeModal; $("mCancel").onclick = closeModal;
  $("mSave").onclick = async () => {
    const p1 = $("npw").value, p2 = $("npw2").value;
    if (p1.length < 4) { toast("4자 이상으로 설정하세요"); return; }
    if (p1 !== p2) { toast("비밀번호가 일치하지 않습니다"); return; }
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const prevSalt = saltB64, prevKey = cryptoKey;
    saltB64 = b64(salt);
    cryptoKey = await deriveKey(p1, salt);
    try {
      await persist();
      closeModal();
      toast("비밀번호 변경됨 ✓");
    } catch (e) {
      saltB64 = prevSalt; cryptoKey = prevKey;   // keep old key usable
      toast(storageErr(e));
    }
  };
}

// ===================== Restore from backup =====================
$("importVaultLink").addEventListener("click", () => {
  const input = document.createElement("input");
  input.type = "file"; input.accept = "application/json,.json";
  input.onchange = () => {
    const file = input.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const o = JSON.parse(reader.result);
        if (!o.salt || !o.iv || !o.ct) throw new Error("형식 오류");
        const vault = { v: o.v || 1, salt: o.salt, iv: o.iv, comp: !!o.comp, ct: ub64(o.ct).buffer };
        if ((await readVault()) && !confirm("현재 이 브라우저의 데이터를 백업 내용으로 덮어씁니다. 계속할까요?")) return;
        await writeVault(vault);
        localStorage.removeItem(STORAGE_KEY);
        await initLockScreen();
        lockMsg("복원 완료. 백업의 비밀번호로 잠금 해제하세요.", "ok");
      } catch {
        lockMsg("올바른 백업 파일이 아닙니다.", "error");
      }
    };
    reader.readAsText(file);
  };
  input.click();
});

// ===================== Toast =====================
let toastTimer = null;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

// ===================== Boot =====================
if (!window.crypto || !crypto.subtle || !window.indexedDB) {
  document.body.innerHTML = '<div style="padding:40px;text-align:center">이 브라우저는 WebCrypto / IndexedDB를 지원하지 않습니다. HTTPS 환경의 최신 브라우저를 사용하세요.</div>';
} else {
  initLockScreen();
}
</script>
